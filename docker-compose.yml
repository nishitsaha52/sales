name: partner-portal

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: partner_portal
      POSTGRES_USER: partner_portal
      POSTGRES_PASSWORD: partner_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partner_portal -d partner_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/partner-portal &&
      mc anonymous set private local/partner-portal"

  backend:
    profiles: ["app"]
    build: ./backend
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://partner_portal:partner_portal@postgres:5432/partner_portal
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      MINIO_BUCKET: partner-portal
      JWT_SECRET_KEY: local-compose-secret-change-before-use
      SEED_ADMIN_EMAIL: admin@tcgdigital.com
      SEED_ADMIN_PASSWORD: ChangeMe123!
      CORS_ORIGINS: http://localhost:5173
    command: >-
      sh -c "alembic upgrade head && python -m app.db.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  frontend:
    profiles: ["app"]
    build: ./frontend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
